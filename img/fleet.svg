<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes sweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .radar { transform-origin: 128px 112px; animation: sweep 9s linear infinite; }
    .yours { animation: blink 2.2s ease-in-out infinite; }
  </style>

  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#rust)" stroke-width="3"/>

  <!-- overview rings: mission control watching every session -->
  <circle cx="128" cy="112" r="78" fill="none" stroke="#2e3f55" stroke-width="2"/>
  <circle cx="128" cy="112" r="48" fill="none" stroke="#2e3f55" stroke-width="2"/>
  <g class="radar">
    <line x1="128" y1="112" x2="128" y2="34" stroke="#3d5a76" stroke-width="3"/>
  </g>

  <!-- the sessions; the one that wants you burns rust -->
  <g fill="#7aa2c0">
    <path d="M86 92 l-13 24 h26 z"/>
    <path d="M170 88 l-13 24 h26 z"/>
    <path d="M100 150 l-13 24 h26 z"/>
  </g>
  <path class="yours" d="M148 120 l-16 30 h32 z" fill="url(#rust)"/>

  <text x="128" y="212" font-family="monospace" font-size="24" font-weight="bold"
        fill="url(#rust)" text-anchor="middle" letter-spacing="3">fleet</text>
  <text x="128" y="230" font-family="monospace" font-size="8" fill="#888"
        text-anchor="middle">mission control</text>
</svg>
