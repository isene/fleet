<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes pulse {
      0%   { opacity: 0.55; }
      50%  { opacity: 1; }
      100% { opacity: 0.55; }
    }
    .flag { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .radar { transform-origin: 128px 118px; animation: sweep 9s linear infinite; }
  </style>

  <rect x="4" y="4" width="248" height="248" rx="28" fill="url(#bg)"
        stroke="#b7410e" stroke-width="4"/>

  <!-- faint overview rings: mission control watching the fleet -->
  <circle cx="128" cy="118" r="86" fill="none" stroke="#2e3f55" stroke-width="2"/>
  <circle cx="128" cy="118" r="54" fill="none" stroke="#2e3f55" stroke-width="2"/>
  <g class="radar">
    <line x1="128" y1="118" x2="128" y2="34" stroke="#3d5a76" stroke-width="3"/>
  </g>

  <!-- the fleet: three sessions steady, the flagship (YOURS) burning rust -->
  <g fill="#7aa2c0">
    <path d="M84 96 l-14 26 h28 z"/>
    <path d="M172 92 l-14 26 h28 z"/>
    <path d="M100 158 l-14 26 h28 z"/>
  </g>
  <path class="flag" d="M146 128 l-20 38 h40 z" fill="url(#rust)"/>

  <!-- the table rows underneath: the screen you read it all from -->
  <g stroke="#2e3f55" stroke-width="6" stroke-linecap="round">
    <line x1="40" y1="226" x2="216" y2="226"/>
  </g>
  <g stroke="#f74c00" stroke-width="6" stroke-linecap="round">
    <line x1="40" y1="226" x2="112" y2="226"/>
  </g>
</svg>
