[package]
name = "fleet"
version = "0.2.6"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Claude Code mission control: live session states, workspace attribution, and inbox watch (scrots, phone transfers). Part of the Fe2O3 Rust terminal suite."
license = "Unlicense"
repository = "https://github.com/isene/fleet"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
serde_json = "1"
x11rb = { version = "0.13", default-features = false }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
